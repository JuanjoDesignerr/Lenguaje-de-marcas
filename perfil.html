<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Usuario</title>
</head>
<body>
    <div id="contenedor">
        <div id="cabecera">
            <a href="index.html"><button class="boton">VOLVER</button></a>
            <h2>PERFIL DEL USUARIO</h2>
        </div>

        <div id="contenido">
            <div id="foto">
                <img src="imagenes/fotoPerfil.jpg" alt="Foto de perfil">
                <button class="btn">CAMBIAR FOTO</button>
            </div>

            <div id="informacion">
                <h3>INFORMACIÓN GENERAL</h3>
                <div class="campo">
                    <label>USUARIO</label>
                    <input type="text">
                </div>
                <div class="campo">
                    <label>CONTRASEÑA</label>
                    <input type="password">
                </div>
                <div class="campo">
                    <label>CORREO</label>
                    <input type="email">
                </div>
                <button class="boton">EDITAR INFORMACIÓN</button>
            </div>
        </div>
    </div>
    
</body>
</html>
