<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidar contraseña</title>
    <link rel="stylesheet" href="css/cssOlvidar.css">
</head>
<body>
    <h1 id="nombre">POLIDEPORTIVO ORIHUELA</h1>
    <div id="contenedor"> 

        <h2>RECUPERAR CONTRASEÑA</h2>

        <div class="campo">
            <label>CORREO ELECTRONICO:</label>
            <input type="email" placeholder="Introduce tu correo">
        </div>

        <button class="boton">ENVIAR CODIGO</button>

        <div class="campo">
            <label>CODIGO:</label>
            <input type="text" placeholder="Introduce el codigo">
        </div>

        <div class="campo">
            <label>CONTRASEÑA:</label>
            <input type="password" placeholder="Nueva contraseña">
        </div>

        <div class="campo">
            <label>CONFIRMAR CONTRASEÑA</label>
            <input type="password" placeholder="Confirmar contraseña">
        </div>

        <a href="Login.html"><button class="boton">GUARDAR</button></a>
        <a href="index.html" class="enlace-inicio">Volver al inicio</a>
    </div>
</body>
</html>
