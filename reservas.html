<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Pista</title>
    <link rel="stylesheet" href="css/cssReservas.css">
</head>
<body>
    <div id="contenedor">
        <h2>COMPLETA TU RESERVA</h2>

        <div id="formulario">
            <div class="campo">
                <label>PISTA A RESERVAR:</label>
                <input type="text" placeholder="Escribe la pista">
            </div>

            <div class="campo">
                <label>FECHA Y HORA:</label>
                <input type="datetime-local" placeholder="Introduce la hora escogida">
            </div>

            <div class="campo">
                <label>NUMERO DE JUGADORES:</label>
                <input type="number" placeholder="Numero de jugadores">

                <button class="boton">PAGAR</button>
                <a href="index.html" class="enlace-inicio">Volver atras</a>

            </div>
        </div>
    </div>
</body>
</html>
